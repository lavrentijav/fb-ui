name: Native fleet build

# Builds the two native binaries and the interface for a release. It is
# separate from release.yml so the main line's packaging is untouched while the
# native fleet is being brought up.
on:
  workflow_dispatch:
  push:
    branches:
      - native
    tags:
      - "native-v*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "packaging/native/**"
      - ".github/workflows/native.yml"

permissions:
  contents: write

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p out
          go build -trimpath -ldflags "$LDFLAGS" -o out/fbmaster ./cmd/fbmaster
          go build -trimpath -ldflags "$LDFLAGS" -o out/fbnode ./cmd/fbnode
          (cd out && sha256sum fbmaster fbnode > SHA256SUMS)
          file out/fbmaster out/fbnode
      - uses: actions/upload-artifact@v7
        with:
          name: native-binaries-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error

  ui:
    name: interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package dist
        run: |
          mkdir -p out
          tar -czf out/fbui-dist.tar.gz -C internal/web dist
      - uses: actions/upload-artifact@v7
        with:
          name: fbui-dist
          path: out/fbui-dist.tar.gz
          if-no-files-found: error

  package:
    name: package
    needs: [binaries, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Assemble tarballs
        run: |
          VERSION="$(git describe --tags --always)"
          mkdir -p release
          for arch in amd64 arm64; do
            dir="release/native-${VERSION}-linux-${arch}"
            mkdir -p "$dir/packaging"
            cp "artifacts/native-binaries-${arch}/fbmaster" "artifacts/native-binaries-${arch}/fbnode" "$dir/"
            cp "artifacts/native-binaries-${arch}/SHA256SUMS" "$dir/SHA256SUMS"
            cp packaging/native/fbmaster.service packaging/native/fbnode.service "$dir/packaging/"
            cp artifacts/fbui-dist/fbui-dist.tar.gz "$dir/"
            (cd release && tar -czf "native-${VERSION}-linux-${arch}.tar.gz" "native-${VERSION}-linux-${arch}")
            (cd release && sha256sum "native-${VERSION}-linux-${arch}.tar.gz" >> SHA256SUMS.txt)
          done
          cat release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: native-release
          path: release/*.tar.gz
          if-no-files-found: error
      - name: Attach to the tag
        if: startsWith(github.ref, 'refs/tags/native-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Native fleet build ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" release/*.tar.gz release/SHA256SUMS.txt --clobber
